<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Contact - PocketSmart AI</title>
<link rel="icon" href="logo.png" type="image/png">
<link rel="stylesheet" href="style.css">
</head>
<body>

<div class="container">

<h1>📞 Contact Us</h1>

<div class="card">

<label>Your Name</label>
<input type="text" placeholder="Enter your name">

<label>Email</label>
<input type="email" placeholder="Enter your email">

<label>Message</label>
<textarea placeholder="Type your message" style="width:100%;height:120px;padding:12px;border-radius:10px;"></textarea>

<button onclick="sendMsg()">Send Message</button>

<p id="msg"></p>

</div>

<button onclick="window.location='index.html'">⬅ Back to Home</button>

</div>

<script>
function sendMsg(){
document.getElementById("msg").innerHTML=
"<span style='color:green;'>✅ Message Sent Successfully!</span>";
}
</script>

</body>
</html>
