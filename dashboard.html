<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Jewelry Planner</title>
<link rel="stylesheet" href="style.css">
</head>
<body>

<div class="container">

<h1>💍 Jewelry Budget Planner</h1>
<p>Get jewelry suggestions based on your budget and occasion.</p>

<div class="card">

<label>Budget (₹)</label>
<input type="number" id="budget" placeholder="Enter Budget">

<label>Occasion</label>
<select id="occasion">
<option>Wedding</option>
<option>Birthday</option>
<option>Festival</option>
<option>Engagement</option>
</select>

<label>Upload Outfit Image (Optional)</label>
<input type="file" accept="image/*">

<button onclick="jewelAI()">Generate AI Recommendation</button>

</div>

<div class="card">

<span class="badge">AI Recommended Jewelry</span>

<div id="result">

<div class="product">
<span>✨ Gold Earrings</span>
<strong>₹1,499</strong>
</div>

<div class="product">
<span>💎 Diamond Necklace</span>
<strong>₹4,999</strong>
</div>

<div class="product">
<span>🌸 Silver Bracelet</span>
<strong>₹999</strong>
</div>

</div>

</div>

<button onclick="window.location='dashboard.html'">
⬅ Back
</button>

</div>

<script>
function jewelAI(){

let b=document.getElementById("budget").value;
let o=document.getElementById("occasion").value;

document.getElementById("result").innerHTML=`
<div class="product">
<span>✨ Gold Earrings</span>
<strong>₹1,499</strong>
</div>

<div class="product">
<span>💎 Diamond Necklace</span>
<strong>₹4,999</strong>
</div>

<div class="product">
<span>🌸 Silver Bracelet</span>
<strong>₹999</strong>
</div>

<p style="margin-top:15px;color:green;">
Occasion: ${o}<br>
Budget: ₹${b}
</p>
`;
}
</script>

</body>
</html>
