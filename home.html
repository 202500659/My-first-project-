<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Home Planner</title>
<link rel="stylesheet" href="style.css">
</head>
  <footer style="margin-top:40px;text-align:center;padding:20px;color:#666;border-top:1px solid #ddd;">
  <p><strong>PocketSmart AI</strong></p>
  <p>Smart Budget & Recommendation Assistant</p>
  <p>Developed by <strong>SARANYA R P (202500659)</strong></p>
  </footer>
<body>

<div class="container">

<h1>🏠 Home Interior Planner</h1>
<p>Enter your budget and get smart recommendations.</p>

<div class="card">

<label>Budget (₹)</label>
<input type="number" id="budget" placeholder="Enter Budget">

<button onclick="homeAI()">Generate AI Recommendation</button>

</div>

<div class="card">

<span class="badge">AI Recommended Products</span>

<div id="result">

<div class="product">
<span>💡 LED Light (Amazon)</span>
<strong>₹499</strong>
</div>

<div class="product">
<span>🪑 Dining Table (IKEA)</span>
<strong>₹4,999</strong>
</div>

<div class="product">
<span>🌀 Ceiling Fan (Flipkart)</span>
<strong>₹1,999</strong>
</div>

</div>

</div>

<button onclick="window.location='dashboard.html'">
⬅ Back
</button>

</div>

<script>
function homeAI(){
  let b=document.getElementById("budget").value;

  showLoading("result", function(){
    document.getElementById("result").innerHTML=`
      <div class="product">
        <span>💡 LED Light (Amazon)</span>
        <strong>₹499</strong>
      </div>
      <div class="product">
        <span>🪑 Dining Table (IKEA)</span>
        <strong>₹4,999</strong>
      </div>
      <div class="product">
        <span>🌀 Ceiling Fan (Flipkart)</span>
        <strong>₹1,999</strong>
      </div>
      <p style="color:green;">Budget: ₹${b}</p>
    `;
  });
}(){

let b=document.getElementById("budget").value;

document.getElementById("result").innerHTML=
`
<div class="product">
<span>💡 LED Light (Amazon)</span>
<strong>₹499</strong>
</div>

<div class="product">
<span>🪑 Dining Table (IKEA)</span>
<strong>₹4,999</strong>
</div>

<div class="product">
<span>🌀 Ceiling Fan (Flipkart)</span>
<strong>₹1,999</strong>
</div>

<p style="margin-top:15px;color:green;">
Budget: ₹${b}
</p>
`;

}
</script>

</body>
</html>
