<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Party Planner</title>
<link rel="stylesheet" href="style.css">
</head>
  <footer style="margin-top:40px;text-align:center;padding:20px;color:#666;border-top:1px solid #ddd;">
  <p><strong>PocketSmart AI</strong></p>
  <p>Smart Budget & Recommendation Assistant</p>
  <p>Developed by <strong>SARANYA R P (202500659)</strong></p>
  </footer>
<body>

<div class="container">

<h1>🎉 Party Budget Planner</h1>
<p>Plan your event within your budget.</p>

<div class="card">

<label>Total Budget (₹)</label>
<input type="number" id="budget" placeholder="Enter Budget">

<label>Guests</label>
<input type="number" id="guests" placeholder="Enter Guests">

<button onclick="partyAI()">Generate Plan</button>

</div>

<div class="card">

<span class="badge">AI Budget Split</span>

<div id="result">

<div class="product">
<span>🍔 Food (Swiggy)</span>
<strong>50%</strong>
</div>

<div class="product">
<span>🎈 Decoration (Amazon)</span>
<strong>30%</strong>
</div>

<div class="product">
<span>🏨 Venue (OYO)</span>
<strong>20%</strong>
</div>

</div>

</div>

<button onclick="window.location='dashboard.html'">
⬅ Back
</button>

</div>

<script>
function partyAI(){

let b=Number(document.getElementById("budget").value)||0;
let g=document.getElementById("guests").value;

let food=Math.round(b*0.50);
let deco=Math.round(b*0.30);
let venue=Math.round(b*0.20);

document.getElementById("result").innerHTML=`
<div class="product">
<span>🍔 Food (Swiggy)</span>
<strong>₹${food}</strong>
</div>

<div class="product">
<span>🎈 Decoration (Amazon)</span>
<strong>₹${deco}</strong>
</div>

<div class="product">
<span>🏨 Venue (OYO)</span>
<strong>₹${venue}</strong>
</div>

<p style="margin-top:15px;color:green;">
Guests: ${g}
</p>
`;
}
</script>

</body>
</html>
